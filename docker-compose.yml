# ─────────────────────────────────────────────────────────
# docker-compose.yml  —  PRODUCTION / CI  (image-based, Neon DB)
#
# Services are added via fragments in services/ by Jenkins.
# Local dev: docker-compose.override.yml swaps images to builds.
# ─────────────────────────────────────────────────────────
services:
  api-gateway:
    image: ghcr.io/${GHCR_OWNER}/rmsb-api-gateway:${TAG:-latest}
    container_name: rmsb-api-gateway
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      PORT: 8080
      FRONTEND_URL: http://frontend:5173

  frontend:
    image: ghcr.io/${GHCR_OWNER}/rmsb-frontend:${TAG:-latest}
    container_name: rmsb-frontend
    environment:
      VITE_API_GATEWAY_URL: ${VITE_API_GATEWAY_URL:-http://localhost:8080}
    depends_on:
      - api-gateway
