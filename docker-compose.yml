# ─────────────────────────────────────────────────────────
# docker-compose.yml  —  PRODUCTION / CI  (image-based)
# Auto-generated by RMSB Registry — do not edit manually.
# To regenerate: Settings → Services → Sync Compose
# ─────────────────────────────────────────────────────────
version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: rmsb-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  s1:
    image: ghcr.io/sairanawaz/rmsb-s1-api:latest
    container_name: rmsb-s1
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      DB_SCHEMA: schema_s1
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy

  api-gateway:
    image: ghcr.io/sairanawaz/rmsb-api-gateway:${TAG:-latest}
    container_name: rmsb-api-gateway
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      S1_SERVICE_URL: http://s1:3001
    depends_on:
      postgres:
        condition: service_healthy
      s1:
        condition: service_started

  frontend:
    image: ghcr.io/sairanawaz/rmsb-frontend:${TAG:-latest}
    container_name: rmsb-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_GATEWAY_URL: http://localhost:8080
    depends_on:
      - api-gateway

volumes:
  postgres_data:
