# ─────────────────────────────────────────────────────────
# docker-compose.yml  —  PRODUCTION / CI  (image-based)
# Auto-generated by the service registry — do not edit manually.
# To regenerate: activate or deactivate a service from the dashboard.
# ─────────────────────────────────────────────────────────
version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: rmsb-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  s1:
    image: ghcr.io/sairanawaz/rmsb-s1-api:latest
    container_name: rmsb-s1
    environment:
      PORT: 3000
      DB_SCHEMA: schema_s1
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy

  client:
    image: ghcr.io/kloudius/rmsb-client-api:latest
    container_name: rmsb-client
    environment:
      PORT: 3000
      DB_SCHEMA: schema_client
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy

  api-gateway:
    image: ghcr.io/${GHCR_OWNER:-kloudius}/rmsb-api-gateway:${TAG:-latest}
    container_name: rmsb-api-gateway
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      ADMIN_EMAILS: ${ADMIN_EMAILS}
      DEPLOY_TOKEN: ${DEPLOY_TOKEN}
      GITHUB_REPO: ${GITHUB_REPO:-Kloudius/multiservice_process_dashboard}
      GHCR_OWNER: ${GHCR_OWNER:-kloudius}
      FRONTEND_URL: http://frontend:5173
      S1_SERVICE_URL: http://s1:3000
      CLIENT_SERVICE_URL: http://client:3000
    depends_on:
      postgres:
        condition: service_healthy
      s1:
        condition: service_started
      client:
        condition: service_started

  frontend:
    image: ghcr.io/${GHCR_OWNER:-kloudius}/rmsb-frontend:${TAG:-latest}
    container_name: rmsb-frontend
    environment:
      VITE_API_GATEWAY_URL: http://localhost:8080
    depends_on:
      - api-gateway

volumes:
  postgres_data:
