# ─────────────────────────────────────────────────────────
# docker-compose.yml  —  PRODUCTION / CI  (image-based)
#
# Uses pre-built images from the registry. No service source
# code required. All teams can run the full platform with:
#
#   cp .env.example .env
#   docker compose up
# ─────────────────────────────────────────────────────────
version: '3.9'

x-db-env: &db-env
  DB_HOST: postgres
  DB_PORT: 5432
  DB_USER: ${POSTGRES_USER}
  DB_PASSWORD: ${POSTGRES_PASSWORD}
  DB_NAME: ${POSTGRES_DB}

services:
  postgres:
    image: ghcr.io/sairanawaz/rmsb-postgres:latest
    container_name: rmsb-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  s1:
    image: ghcr.io/sairanawaz/rmsb-s1-api:${TAG:-latest}
    container_name: rmsb-s1
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      <<: *db-env
    depends_on:
      postgres:
        condition: service_healthy

  s2:
    image: ghcr.io/sairanawaz/rmsb-s2-api:${TAG:-latest}
    container_name: rmsb-s2
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      <<: *db-env
    depends_on:
      postgres:
        condition: service_healthy

  api-gateway:
    image: ghcr.io/sairanawaz/rmsb-api-gateway:${TAG:-latest}
    container_name: rmsb-api-gateway
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      S1_SERVICE_URL: http://s1:3001
      S2_SERVICE_URL: http://s2:3002
    depends_on:
      - s1
      - s2

  frontend:
    image: ghcr.io/sairanawaz/rmsb-frontend:${TAG:-latest}
    container_name: rmsb-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_GATEWAY_URL: http://localhost:8080
    depends_on:
      - api-gateway

volumes:
  postgres_data:
