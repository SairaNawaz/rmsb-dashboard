# ─────────────────────────────────────────────────────────────────────────────
# docker-compose.local.example.yml
#
# Copy to docker-compose.local.yml — this file is committed as a reference.
# Credentials are never stored here; they live in gitignored .env files.
#
#   cp docker-compose.local.example.yml docker-compose.local.yml
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up --build
# ─────────────────────────────────────────────────────────────────────────────

services:
  api-gateway:
    build: ./api-gateway

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_GATEWAY_URL: ${VITE_API_GATEWAY_URL:-http://localhost:8080}
        VITE_APP_NAME: ${VITE_APP_NAME:-MultiService Process Dashboard}
        VITE_ADMIN_EMAILS: ${VITE_ADMIN_EMAILS:-}

  s1:
    build:
      context: ../s1-device-management
      args:
        VITE_BASE_PATH: /s1
        VITE_API_GATEWAY_URL: ${VITE_API_GATEWAY_URL:-http://localhost:8080}
    env_file:
      - ../s1-device-management/.env
    environment:
      PORT: 3000

  grafana:
    image: grafana/grafana:10.4.3
    ports:
      - "3100:3000"
    volumes:
      - ../s1-device-management/grafana/provisioning:/etc/grafana/provisioning
      - ../s1-device-management/grafana/dashboards:/var/lib/grafana/dashboards
      - grafana_data:/var/lib/grafana
    env_file:
      - ../s1-device-management/.env
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer

volumes:
  grafana_data:
