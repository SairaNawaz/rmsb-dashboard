# ─────────────────────────────────────────────────────────
# docker-compose.dev.yml  —  LOCAL DEVELOPMENT (build from source)
#
# Overrides docker-compose.yml to build services from local
# source code instead of pulling pre-built images.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#
# Expected workspace layout (all sibling folders):
#   AutomationInitiatives/
#   ├── rmsb-dashboard/              ← this repo (run compose from here)
#   ├── rmsb-s1-device-management/
#   └── rmsb-s2-capacity-planning/
#
# Override any path via .env if your folder names differ.
# ─────────────────────────────────────────────────────────
version: '3.9'

services:
  s1:
    build: ${S1_PATH:-../s1-device-management}
    image: ""

  s2:
    build: ${S2_PATH:-../s2-capacity-planning}
    image: ""

  api-gateway:
    build: ${GATEWAY_PATH:-./api-gateway}
    image: ""

  frontend:
    build: ${FRONTEND_PATH:-./frontend}
    image: ""
