name: CI — Build & Push Images

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docker-compose.yml'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docker-compose.yml'

env:
  REGISTRY: ghcr.io
  OWNER: ${{ vars.GHCR_OWNER }}

jobs:
  build-frontend:
    name: Build Frontend Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Validate required variables
        run: |
          if [ -z "$OWNER" ]; then
            echo "Error: GHCR_OWNER repository variable is not set. Go to Settings → Variables → Actions and add GHCR_OWNER."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/${{ env.OWNER }}/rmsb-frontend:latest
          build-args: |
            VITE_ADMIN_EMAILS=${{ secrets.VITE_ADMIN_EMAILS }}

  build-gateway:
    name: Build API Gateway Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Validate required variables
        run: |
          if [ -z "$OWNER" ]; then
            echo "Error: GHCR_OWNER repository variable is not set. Go to Settings → Variables → Actions and add GHCR_OWNER."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push gateway image
        uses: docker/build-push-action@v5
        with:
          context: ./api-gateway
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/${{ env.OWNER }}/rmsb-api-gateway:latest

