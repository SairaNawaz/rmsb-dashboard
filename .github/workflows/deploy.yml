name: CD — Deploy to Oracle VM

on:
  workflow_run:
    workflows: ["CI — Build & Push Images"]
    types:
      - completed
    branches: [main]
  repository_dispatch:
    types: [service-deploy]
  push:
    branches: [main]
    paths:
      - 'docker-compose.yml'

jobs:
  deploy:
    name: Deploy to VM
    runs-on: ubuntu-latest
    environment: production
    if: ${{ github.event_name == 'repository_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          envs: DEPLOY_TOKEN
          script: |
            cd multiservice_process_dashboard
            git remote set-url origin https://x-access-token:$DEPLOY_TOKEN@github.com/Kloudius/multiservice_process_dashboard.git
            git fetch origin
            git reset --hard origin/main
            git remote set-url origin https://github.com/Kloudius/multiservice_process_dashboard.git
            docker compose pull
            docker compose up -d
            echo "Deployed at $(date)"
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
